name: ci

# The simplified orchestrator (orchestrator/): vet, test and formatting.

on:
  pull_request:
    paths: ["orchestrator/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["orchestrator/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: orchestrator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
