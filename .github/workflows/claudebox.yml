name: claudebox

# The run wrapper and launcher (claudebox/launcher/): vet, test and build.
# The image's own tests (claudebox/tests/run.sh) need Docker and run locally.

on:
  pull_request:
    paths: ["claudebox/launcher/**", ".github/workflows/claudebox.yml"]
  push:
    branches: [main]
    paths: ["claudebox/launcher/**", ".github/workflows/claudebox.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: claudebox/launcher

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: claudebox/launcher/go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
