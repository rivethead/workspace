# SPIRE OIDC discovery provider: publishes the keys that sign JWT-SVIDs, so
# agentgateway and our services can check them (docs/plan.md: "internal").
log_level = "INFO"
domains = ["spire-oidc"]
allow_insecure_scheme = true
insecure_addr = ":8008"

server_api {
    address = "unix:///tmp/spire-server/private/api.sock"
}

health_checks {
    bind_port = "8009"
    live_path = "/live"
    ready_path = "/ready"
}
