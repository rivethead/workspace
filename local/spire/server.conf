# Local SPIRE server: the stand-in for the two serverless container servers (docs/plan.md, SPIRE).
# Same plugins as in the cloud where a local equivalent exists: x509pop node attestation
# with our node CA, Postgres datastore. The disk key manager replaces the cloud KMS plugin.
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "workspace.local"
    data_dir = "/opt/spire/data/server"
    log_level = "INFO"
    ca_ttl = "168h"
    default_x509_svid_ttl = "1h"
    # JWT-SVIDs last 15 minutes (docs/plan.md).
    default_jwt_svid_ttl = "15m"
    # The iss claim of every JWT-SVID; agentgateway requires it to match.
    jwt_issuer = "http://spire-oidc:8008"
    # The provisioner manages registration entries over the admin API (L5).
    admin_ids = ["spiffe://workspace.local/service/provisioner"]
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "postgres"
            connection_string = "dbname=spire user=workspace password=workspace host=postgres port=5432 sslmode=disable"
        }
    }
    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }
    # Laptops prove themselves with a machine certificate signed by our node CA.
    NodeAttestor "x509pop" {
        plugin_data {
            mode = "external_pki"
            ca_bundle_path = "/opt/spire/conf/node-ca/ca.pem"
            agent_path_template = "/x509pop/{{ .Subject.CommonName }}"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8080"
    live_path = "/live"
    ready_path = "/ready"
}
