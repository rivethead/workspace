# Tornjak backend: a web API over the SPIRE server's admin socket. Whoever can
# reach it can create and delete registration entries, so it listens on
# 127.0.0.1 only, and in the cloud it sits behind people's sign-in (docs/plan.md).
server {
  spire_socket_path = "unix:///tmp/spire-server/private/api.sock"

  http {
    port = 10000
  }
}

plugins {
  # Tornjak's own metadata (agent groups, selectors), not SPIRE's data.
  DataStore "sql" {
    plugin_data {
      drivername = "sqlite3"
      filename = "/var/lib/tornjak/tornjak.sqlite3"
    }
  }
}
